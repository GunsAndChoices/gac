<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guns And Choices</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Italiana&family=Orbitron:wght@400;700&family=Rajdhani:wght@600&family=Forum&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        forum: ['Forum', 'serif'],
                        italiana: ['Italiana', 'serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                        main: ['Rajdhani', 'sans-serif'],
                        audiowide: ['Audiowide', 'cursive'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Verhindert das "Zittern" bei Skalierungen */
        .nav-link {
            display: inline-block;
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-900 text-white font-main">
    <div class="m-5">
        <div class="bg-gray-800 rounded-lg shadow-2xl p-4 border border-gray-700">
            <nav class="container mx-auto flex justify-between items-center">

                <a href="#" class="flex items-center group">
                    <img src="icon.png" alt="Logo"
                        class="h-10 w-16 object-cover [clip-path:polygon(15%_0%,_85%_0%,_100%_50%,_85%_100%,_15%_100%,_0%_50%)] bg-purple-600 group-hover:bg-purple-400 transition-colors duration-300">
                    <span
                        class="ml-4 text-2xl font-audiowide text-purple-500 group-hover:text-purple-400 hover:scale-110 transition-all duration-300">
                        Guns And Choices
                    </span>
                </a>

                <div class="flex items-center space-x-6 font-audiowide">
                    <a href="#" class="nav-link text-lg text-purple-400 hover:text-purple-300 hover:scale-110">Home</a>
                    <a href="#" class="nav-link text-lg text-gray-300 hover:text-white hover:scale-110">About</a>
                    <a href="#" class="nav-link text-lg text-gray-300 hover:text-white hover:scale-110">Creative</a>
                    <a href="#" class="nav-link text-lg text-gray-300 hover:text-white hover:scale-110">Contact</a>
                    <a href="#" class="nav-link text-lg text-gray-300 hover:text-white hover:scale-110">Impressum</a>
                    <a href="#"
                        class="ml-4 flex items-center gap-2 px-4 py-2 border-2 border-purple-500/30 rounded-lg bg-gray-900/50 text-gray-200 hover:text-white hover:border-purple-500 hover:bg-purple-500/10 transition-all duration-300 group">Launcher</a>
                    <a href="#"
                        class="ml-4 flex items-center gap-2 px-4 py-2 border-2 border-purple-500/30 rounded-lg bg-gray-900/50 text-gray-200 hover:text-white hover:border-purple-500 hover:bg-purple-500/10 transition-all duration-300 group">
                        <i class="fa-solid fa-user text-xl group-hover:rotate-12 transition-transform"></i>
                        <span class="text-lg">Login</span>
                    </a>
                </div>
            </nav>
        </div>
    </div>

    <div class="m-5">
        <div class="bg-gray-800 rounded-lg shadow-2xl p-6 border border-gray-700">
            <p class="text-lg text-gray-300 leading-relaxed">

                earum id dolorem impedit ut hic excepturi corporis? Error nam delectus beatae voluptates distinctio
                officia atque placeat!
            </p>
        </div>
    </div>
</body>

</html>
