<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-purple': '#4A099A',
                        'cyber-blue': '#003f92',
                        'cyber-black': '#070707',
                        'black': '#000000',
                    },
                    fontFamily: {
                        'orbitron': ['Orbitron', 'sans-serif'],
                        'rajdhani': ['Rajdhani', 'sans-serif'],
                    },
                    animation: {
                        'glitch': 'glitch 2s linear infinite',
                    },
                    keyframes: {
                        glitch: {
                            '0%, 100%': { transform: 'skew(0deg)' },
                            '20%': { transform: 'skew(2deg)' },
                            '40%': { transform: 'skew(-1deg)' },
                            '60%': { transform: 'skew(1deg)' },
                            '80%': { transform: 'skew(-2deg)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-cyber-blue font-rajdhani m-0 p-0 flex justify-center items-center h-screen overflow-hidden">
    <div class="text-center p-8 border border-cyber-purple rounded-md shadow-[0_0_20px_#4A099A] bg-cyber-black max-w-2xl">
        <h1 class="font-orbitron text-[3.5rem] m-0 relative text-cyber-purple drop-shadow-[0_0_10px_#003f92] animate-glitch" data-text="Coming soon">
            Coming soon
        </h1>
        <p class="text-[1.2rem] leading-[1.6] my-8">
            We're working on the launcher page. Check back soon.
        </p>
        <a href="index.html" class="inline-block py-4 px-8 bg-gradient-to-r from-cyber-purple to-cyber-blue text-white no-underline font-orbitron text-[1.2rem] rounded-md transition-all duration-300 shadow-[0_0_10px_#4A099A] hover:scale-105 hover:shadow-[0_0_20px_#003f92]">
            Home
        </a>
    </div>
</body>
</html>
